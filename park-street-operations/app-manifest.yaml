display_information:
  name: Park Street Operations DEV
  description: Arabic, private staging pilot for mall work orders
  background_color: "#183153"
features:
  bot_user:
    display_name: Park Street Ops DEV
    always_online: false
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
  shortcuts:
    - name: New demo SNAG
      type: global
      callback_id: parkops_new
      description: Create a demonstration work order
  slash_commands:
    - command: /parkops-demo
      description: Open demo work-order form
      usage_hint: demo
      should_escape: false
      url: https://STAGING_HOST.example.com/slack/events
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - files:read
settings:
  event_subscriptions:
    request_url: https://STAGING_HOST.example.com/slack/events
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: https://STAGING_HOST.example.com/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false

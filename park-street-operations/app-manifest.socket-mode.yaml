display_information:
  name: Park Street Operations DEV
  description: Private staging-only pilot for Park Street mall operations
  background_color: "#183153"
features:
  bot_user:
    display_name: Park Street Ops DEV
    always_online: false
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: false
  shortcuts:
    - name: New demo SNAG
      type: global
      callback_id: parkops_new
      description: Create a demonstration work order only
  slash_commands:
    - command: /parkops-demo
      description: Open isolated demo work-order form
      usage_hint: demo
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
